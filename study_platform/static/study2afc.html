<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paired Comparison Session</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="card wide">
  <header class="topbar">
    <span id="progress-label">0 / 0</span>
    <div class="progressbar"><div id="progress-fill"></div></div>
    <span class="muted" id="block-label"></span>
  </header>

  <section id="trial">
    <h2 id="question">Which image has the more bothersome loss of highlight/shadow detail?</h2>
    <div class="pair">
      <div class="pane" id="pane-L">
        <img id="imgL" alt="left" draggable="false">
        <div class="pane-tag">Left</div>
      </div>
      <div class="pane" id="pane-R">
        <img id="imgR" alt="right" draggable="false">
        <div class="pane-tag">Right</div>
      </div>
    </div>
    <div class="choice-row">
      <button id="btn-L" class="choice">◀ Left is worse</button>
      <button id="btn-R" class="choice">Right is worse ▶</button>
    </div>
    <div id="severity-step" hidden>
      <h3>How much worse is the image you chose?</h3>
      <div class="rating-area">
        <span class="anchor">0<br><small>almost identical</small></span>
        <input type="range" id="slider" min="0" max="100" step="1" value="30">
        <span class="anchor">100<br><small>hugely worse</small></span>
      </div>
      <button id="btn-ok" class="primary">Confirm</button>
    </div>
  </section>

  <section id="end" hidden>
    <h1>Thank you!</h1>
    <p>Your responses have been recorded. Code: <strong id="code">—</strong></p>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const pid = localStorage.getItem("eaqi_pid");
if (!pid) location.href = "/";
let cur = null, t0 = 0, choseSide = null;
const slider = $("#slider");

async function next() {
  const r = await fetch(`/api/next?p=${encodeURIComponent(pid)}&mode=2afc`);
  const j = await r.json();
  if (j.done) return finish();
  cur = j;
  $("#progress-label").textContent = `${j.trial_index + 1} / ${j.n_total}`;
  $("#progress-fill").style.width = (100 * (j.trial_index + 1) / j.n_total) + "%";
  $("#block-label").textContent = j.warmup ? "practice" : "";
  // pair: show the E/T pair for this base (paired design)
  const man = await (await fetch("/api/manifest")).json();
  const f = man.stimuli.find(s => s.base === j.base).files;
  // random left/right
  const leftCond = Math.random() < 0.5 ? "E" : "T";
  const rightCond = leftCond === "E" ? "T" : "E";
  $("#imgL").src = "/stimuli/" + f[leftCond] + "?t=" + Date.now();
  $("#imgR").src = "/stimuli/" + f[rightCond] + "?t=" + Date.now();
  cur.leftCond = leftCond; cur.rightCond = rightCond;
  $("#severity-step").hidden = true;
  $("#btn-L").disabled = $("#btn-R").disabled = false;
  t0 = performance.now();
}

function choose(side) {
  choseSide = side;
  $("#btn-L").disabled = $("#btn-R").disabled = true;
  $("#severity-step").hidden = false;
}
$("#btn-L").onclick = () => choose("L");
$("#btn-R").onclick = () => choose("R");

$("#btn-ok").onclick = async () => {
  const rt = Math.round(performance.now() - t0);
  // rating: +severity if T on chosen side is "T worse", negative if E chosen
  const condChosen = choseSide === "L" ? cur.leftCond : cur.rightCond;
  const sign = condChosen === "T" ? 1 : -1;
  await fetch("/api/rate", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      participant: pid, base: cur.base, cond: "PAIR",
      is_repeat: 0, rating: sign * +slider.value,
      severity_delta: +slider.value, rt_ms: rt,
      shown_left: cur.leftCond, trial_index: cur.trial_index,
      mode: "2afc",
    })});
  next();
};

async function finish() {
  await fetch("/api/finish", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({participant: pid})});
  $("#trial").hidden = true;
  $("#end").hidden = false;
  $("#code").textContent = "EAQI2AFC-" + pid.toUpperCase();
}
next();
</script>
</body>
</html>
